name: Quality Gate

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Test, and Release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm desktop:typecheck

      - name: Rust Format
        run: pnpm rust:fmt:check

      - name: Rust Tests
        run: cargo test --workspace --locked

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release Checks
        run: pnpm release:check

      - name: Release Workflow Policy
        run: node scripts/check-release-policy.mjs

      - name: Release Checks Self-Test
        run: node scripts/test-release-checks.mjs

  windows-compile:
    name: Windows Compile (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            rust_target: x86_64-pc-windows-msvc
          - name: x86
            rust_target: i686-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: windows-${{ matrix.rust_target }}

      - name: Compile Windows Target
        shell: bash
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.rust_target }}
