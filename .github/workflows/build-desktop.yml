name: Build Desktop Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布到 GitHub Release"
        required: false
        type: boolean
        default: false
      version_mode:
        description: "版本号模式"
        required: true
        type: choice
        default: 自动
        options:
          - 自动
          - 手动
      version:
        description: "手动版本号，例如 1.1.4。自动模式留空。"
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        shell: bash
        run: pnpm check

  prepare_release:
    name: Prepare Release Version
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.version }}
      target_commit: ${{ steps.version.outputs.target_commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve Version
        id: version
        shell: bash
        env:
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_VERSION_MODE: ${{ inputs.version_mode }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "target_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${INPUT_VERSION_MODE:-自动}" == "手动" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ -z "${version}" ]]; then
              echo "::error::手动版本号不能为空。"
              exit 1
            fi
            if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::手动版本号必须是类似 1.1.3 或 1.1.3-beta.1 的格式。"
              exit 1
            fi
          else
            base_version="$(node <<'NODE'
          const fs = require('fs');

          const packageJson = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8');
          const cargoMatch = cargoToml.match(/^version = "([^"]+)"$/m);

          if (!cargoMatch) {
            console.error('Unable to resolve version from apps/desktop/src-tauri/Cargo.toml');
            process.exit(1);
          }

          const versions = {
            packageJson: packageJson.version,
            tauriConfig: tauriConfig.version,
            cargoToml: cargoMatch[1],
          };

          const uniqueVersions = [...new Set(Object.values(versions))];
          if (uniqueVersions.length !== 1) {
            console.error(`Version mismatch detected: ${JSON.stringify(versions)}`);
            process.exit(1);
          }

          process.stdout.write(uniqueVersions[0]);
          NODE
            )"
            version="$(BASE_VERSION="${base_version}" node <<'NODE'
          const { execFileSync } = require('child_process');

          const baseVersion = process.env.BASE_VERSION;
          const match = baseVersion.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!match) {
            console.error(`自动版本模式只支持 x.y.z 格式，当前项目版本是 ${baseVersion}。`);
            process.exit(1);
          }

          const major = Number(match[1]);
          const minor = Number(match[2]);
          let patch = Number(match[3]);
          const tags = new Set(
            execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/v${major}.${minor}.*`], {
              encoding: 'utf8',
            })
              .split(/\r?\n/)
              .map((line) => line.trim().split(/\s+/)[1])
              .filter(Boolean)
              .map((ref) => ref.replace('refs/tags/v', '')),
          );

          let nextVersion = `${major}.${minor}.${patch}`;
          while (tags.has(nextVersion)) {
            patch += 1;
            nextVersion = `${major}.${minor}.${patch}`;
          }

          process.stdout.write(nextVersion);
          NODE
            )"
          fi

          target_commit="${GITHUB_SHA}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target_commit=${target_commit}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "publish_release=${INPUT_PUBLISH_RELEASE:-false}" >> "$GITHUB_OUTPUT"

      - name: Preview Chinese Changelog
        shell: bash
        run: |
          if [[ ! -s CHANGELOG.zh-CN.md ]]; then
            echo "::error::CHANGELOG.zh-CN.md 不存在或内容为空。"
            exit 1
          fi

          {
            printf "## Release 正文预览\n\n"
            printf "以下中文更新日志会显示在 GitHub Release 正文顶部：\n\n"
            cat CHANGELOG.zh-CN.md
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare_release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LIBERTY_RUNTIME_BUNDLE_READY: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            platform_id: darwin-aarch64
            rust_target: aarch64-apple-darwin
            artifact_name: liberty-macos-aarch64
            artifact_path: |
              target/**/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            platform_id: darwin-x64
            rust_target: x86_64-apple-darwin
            artifact_name: liberty-macos-x64
            artifact_path: |
              target/**/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2022
            platform_id: windows-x64
            rust_target: x86_64-pc-windows-msvc
            artifact_name: liberty-windows-x64
            artifact_path: |
              target/**/release/bundle/msi/*.msi
              target/**/release/bundle/nsis/*.exe
          - name: Windows x86
            os: windows-2022
            platform_id: windows-x86
            rust_target: i686-pc-windows-msvc
            artifact_name: liberty-windows-x86
            artifact_path: |
              target/**/release/bundle/msi/*.msi
              target/**/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.target_commit }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Apply Release Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.RELEASE_VERSION;
          const jsonFiles = [
            'apps/desktop/package.json',
            'apps/desktop/src-tauri/tauri.conf.json',
          ];

          for (const file of jsonFiles) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }

          const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
          const cargoToml = fs.readFileSync(cargoPath, 'utf8');
          fs.writeFileSync(
            cargoPath,
            cargoToml.replace(/^version = "([^"]+)"$/m, `version = "${version}"`),
          );
          NODE

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Prepare Bundled Runtime
        shell: bash
        run: |
          python scripts/prepare_runtime_bundle.py \
            --platform-id "${{ matrix.platform_id }}" \
            --output-dir "runtime-bundles/${{ matrix.platform_id }}"

      - name: Build Tauri Bundle
        shell: bash
        run: pnpm --dir apps/desktop tauri build --target ${{ matrix.rust_target }}

      - name: Inspect Build Outputs
        if: always()
        shell: bash
        run: |
          find runtime-bundles -maxdepth 3 -type f -print || true
          find target -maxdepth 6 -type d -name bundle -print || true
          find target -maxdepth 8 -type f \( -name "*.app" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -print || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare_release
      - build
    runs-on: ubuntu-latest
    if: needs.prepare_release.outputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Ensure Release Tag Exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare_release.outputs.target_commit }}
        run: |
          existing_tag_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n 1)"
          if [[ -z "${existing_tag_sha}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_COMMIT}" >/dev/null
          elif [[ "${GITHUB_REF_TYPE}" != "tag" && "${existing_tag_sha}" != "${TARGET_COMMIT}" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_COMMIT}" \
              -F force=true >/dev/null
          fi

      - name: Prepare Release Assets
        id: assets
        shell: bash
        run: |
          mkdir -p release-upload

          while IFS= read -r -d '' file; do
            artifact_name="$(basename "$(dirname "${file}")")"
            file_name="$(basename "${file}")"
            cp "${file}" "release-upload/${artifact_name}-${file_name}"
          done < <(
            find release-assets -type f \
              \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
              -print0
          )

          asset_count="$(find release-upload -type f | wc -l | tr -d ' ')"
          if [[ "${asset_count}" == "0" ]]; then
            echo "::error::下载的构建产物中未找到可发布文件。"
            exit 1
          fi

          find release-upload -maxdepth 1 -type f -print | sort
          echo "count=${asset_count}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare_release.outputs.target_commit }}
        run: |
          if [[ ! -s CHANGELOG.zh-CN.md ]]; then
            echo "::error::CHANGELOG.zh-CN.md 不存在或内容为空。"
            exit 1
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${TARGET_COMMIT}" \
            --jq ".body" > github-release-notes.md

          {
            cat CHANGELOG.zh-CN.md
            printf "\n\n---\n\n"
            printf "## GitHub 自动生成记录\n\n"
            cat github-release-notes.md
          } > release-notes.md

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          PRERELEASE: ${{ needs.prepare_release.outputs.prerelease }}
        run: |
          mapfile -t assets < <(find release-upload -maxdepth 1 -type f | sort)
          printf "Publishing %s assets to %s\n" "${#assets[@]}" "${RELEASE_TAG}"
          printf " - %s\n" "${assets[@]}"

          release_args=(
            --title "Liberty ${RELEASE_TAG}"
            --notes-file release-notes.md
            --verify-tag
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Deleting existing release ${RELEASE_TAG} before republishing."
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" "${release_args[@]}"

          printf "%s\0" "${assets[@]}" | xargs -0 -n 1 -P 4 bash -c '
            asset="$1"
            echo "::group::Upload $(basename "$asset")"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
            echo "::endgroup::"
          ' _
