name: Build Desktop Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建成功后发布 GitHub Release"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  prepare:
    name: Validate Build Context
    needs:
      - quality
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_version: ${{ steps.context.outputs.release_version }}
      target_commit: ${{ steps.context.outputs.target_commit }}
      build_matrix: ${{ steps.context.outputs.build_matrix }}
      should_publish: ${{ steps.context.outputs.should_publish }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Resolve and Validate Source Version
        id: context
        shell: bash
        env:
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          release_version="$(node scripts/check-version-consistency.mjs --print-version)"
          target_commit="$(git rev-parse HEAD)"
          build_matrix="$(node scripts/check-platform-matrix.mjs --print-matrix)"
          release_tag=""
          should_publish="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            should_publish="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${MANUAL_PUBLISH}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from the main branch."
              exit 1
            fi
            release_tag="v${release_version}"
            should_publish="true"
          fi

          if [[ "${should_publish}" == "true" ]]; then
            node scripts/check-version-consistency.mjs \
              --tag "${release_tag}" \
              --changelog-output release-changelog.md

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              printf "Manual run: v%s will be published after every build and asset check succeeds.\n" \
                "${release_version}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            printf "Manual run: build validation only; no tag or Release will be created.\n" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "target_commit=${target_commit}" >> "${GITHUB_OUTPUT}"
          echo "build_matrix=${build_matrix}" >> "${GITHUB_OUTPUT}"
          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"

  reserve:
    name: Reserve Release Publication
    needs:
      - prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Validated Commit
        if: needs.prepare.outputs.should_publish == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.target_commit }}
          fetch-depth: 0

      - name: Setup Node
        if: needs.prepare.outputs.should_publish == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Reserve Draft Release
        if: needs.prepare.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          node scripts/check-version-consistency.mjs \
            --tag "${RELEASE_TAG}" \
            --changelog-output release-changelog.md

          release_state_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_state_args+=(--allow-absent-tag)
          fi

          release_id="$(node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --allow-resumable-draft \
            --print-release-id \
            "${release_state_args[@]}")"

          if [[ -z "${release_id}" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${TARGET_COMMIT}" \
              --jq ".body" > github-release-notes.md

            {
              printf '<!-- liberty-release-commit:%s -->\n\n' "${TARGET_COMMIT,,}"
              cat release-changelog.md
              printf "\n\n---\n\n"
              printf "## GitHub 自动生成记录\n\n"
              cat github-release-notes.md
            } > release-notes.md

            node scripts/check-release-state.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --expected-commit "${TARGET_COMMIT}" \
              --require-absent-release \
              "${release_state_args[@]}"

            release_id="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="${RELEASE_TAG}" \
                -f target_commitish="${TARGET_COMMIT}" \
                -f name="Liberty ${RELEASE_TAG}" \
                -F body=@release-notes.md \
                -F draft=true \
                --jq ".id"
            )"
          fi

          node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --require-draft-release-id "${release_id}" \
            "${release_state_args[@]}"

          mkdir release-state
          printf '%s' "${release_id}" > release-state/release-id.txt

      - name: Upload Reserved Release State
        if: needs.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-state
          path: release-state/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.name }})
    needs:
      - quality
      - prepare
      - reserve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Checkout Validated Commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.target_commit }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Bundle
        shell: bash
        run: pnpm --dir apps/desktop tauri build --target ${{ matrix.rust_target }}

      - name: Validate Binary Version and Package Assets
        shell: bash
        run: |
          node scripts/check-release-assets.mjs prepare-platform \
            --platform "${{ matrix.platform_id }}" \
            --asset-kinds "${{ matrix.asset_kinds }}" \
            --version "${{ needs.prepare.outputs.release_version }}" \
            --bundle-root "target/${{ matrix.rust_target }}/release/bundle" \
            --output "release-package"

      - name: Upload Validated Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-package/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Immutable GitHub Release
    needs:
      - quality
      - prepare
      - reserve
      - build
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Validated Commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.target_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download Reserved Release State
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-state
          path: release-state

      - name: Download Validated Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: liberty-*
          path: release-assets

      - name: Verify Reserved Release State
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          release_id="$(cat release-state/release-id.txt)"
          release_state_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_state_args+=(--allow-absent-tag)
          fi
          node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --require-draft-release-id "${release_id}" \
            "${release_state_args[@]}"

      - name: Assemble and Validate Release Assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          node scripts/check-release-assets.mjs assemble \
            --input "release-assets" \
            --output "release-upload" \
            --manifest "release-manifest.json" \
            --tag "${RELEASE_TAG}" \
            --version "${RELEASE_VERSION}"
          node scripts/generate-sbom.mjs \
            --output "liberty-${RELEASE_VERSION}.cdx.json"
          node scripts/check-release-assets.mjs add-sbom \
            --input "liberty-${RELEASE_VERSION}.cdx.json" \
            --output "release-upload" \
            --manifest "release-manifest.json"
          (
            cd release-upload
            sha256sum liberty-* > SHA256SUMS.txt
          )
          node scripts/check-release-assets.mjs verify-directory \
            --input "release-upload" \
            --manifest "release-manifest.json" \
            --allow-checksums

      - name: Plan Draft Asset Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(cat release-state/release-id.txt)"
          mkdir draft-existing
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Unsafe Release asset name: ${asset_name}"
                exit 1
              fi
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "draft-existing/${asset_name}"
            done

          node scripts/check-release-assets.mjs plan-draft-upload \
            --local "release-upload" \
            --existing "draft-existing" \
            --manifest "release-manifest.json" \
            --output "draft-upload-list.txt"

      - name: Upload Missing Draft Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(cat release-state/release-id.txt)"
          upload_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.upload_url')"
          upload_url="${upload_url%%\{*}"
          expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
          if [[ "${upload_url}" != "${expected_upload_url}" ]]; then
            echo "::error::GitHub returned an unexpected Release upload URL."
            exit 1
          fi
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            if [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Unsafe Release asset name: ${asset_name}"
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              --request POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@release-upload/${asset_name}" \
              "${upload_url}?name=${asset_name}" \
              >/dev/null
          done < draft-upload-list.txt

      - name: Verify Uploaded Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(cat release-state/release-id.txt)"
          mkdir release-verify
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Unsafe Release asset name: ${asset_name}"
                exit 1
              fi
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "release-verify/${asset_name}"
            done
          node scripts/check-release-assets.mjs verify-directory \
            --input "release-verify" \
            --manifest "release-manifest.json" \
            --allow-checksums

      - name: Publish Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          release_id="$(cat release-state/release-id.txt)"
          release_state_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_state_args+=(--allow-absent-tag)
          fi
          node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --require-draft-release-id "${release_id}" \
            "${release_state_args[@]}"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false >/dev/null

          published="false"
          for attempt in 1 2 3 4 5; do
            if node scripts/check-release-state.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --expected-commit "${TARGET_COMMIT}" \
              --require-published-release-id "${release_id}"; then
              published="true"
              break
            fi
            sleep "$((attempt * 2))"
          done
          if [[ "${published}" != "true" ]]; then
            echo "::error::Published Release ${RELEASE_TAG} did not reach a stable public state."
            exit 1
          fi
