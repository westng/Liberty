name: Build Desktop Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  prepare:
    name: Validate Build Context
    needs:
      - quality
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_version: ${{ steps.context.outputs.release_version }}
      target_commit: ${{ steps.context.outputs.target_commit }}
      resumable_draft_id: ${{ steps.context.outputs.resumable_draft_id }}
      build_matrix: ${{ steps.context.outputs.build_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Resolve and Validate Source Version
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node scripts/check-version-consistency.mjs --print-version)"
          target_commit="$(git rev-parse HEAD)"
          build_matrix="$(node scripts/check-platform-matrix.mjs --print-matrix)"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/check-version-consistency.mjs \
              --tag "${GITHUB_REF_NAME}" \
              --changelog-output release-changelog.md
            resumable_draft_id="$(node scripts/check-release-state.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${GITHUB_REF_NAME}" \
              --expected-commit "${target_commit}" \
              --allow-resumable-draft \
              --print-release-id)"
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag=""
            resumable_draft_id=""
            printf "Manual run: build validation only; no tag or Release will be created.\n" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "target_commit=${target_commit}" >> "${GITHUB_OUTPUT}"
          echo "resumable_draft_id=${resumable_draft_id}" >> "${GITHUB_OUTPUT}"
          echo "build_matrix=${build_matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.name }})
    needs:
      - quality
      - prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Checkout Validated Commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.target_commit }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Bundle
        shell: bash
        run: pnpm --dir apps/desktop tauri build --target ${{ matrix.rust_target }}

      - name: Validate Binary Version and Package Assets
        shell: bash
        run: |
          node scripts/check-release-assets.mjs prepare-platform \
            --platform "${{ matrix.platform_id }}" \
            --asset-kinds "${{ matrix.asset_kinds }}" \
            --version "${{ needs.prepare.outputs.release_version }}" \
            --bundle-root "target/${{ matrix.rust_target }}/release/bundle" \
            --output "release-package"

      - name: Upload Validated Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-package/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Immutable GitHub Release
    needs:
      - quality
      - prepare
      - build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Validated Commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.target_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download Validated Build Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets

      - name: Verify Immutable Tag and Release State
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RESUMABLE_DRAFT_ID: ${{ needs.prepare.outputs.resumable_draft_id }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          current_draft_id="$(node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --allow-resumable-draft \
            --print-release-id)"
          if [[ "${current_draft_id}" != "${RESUMABLE_DRAFT_ID}" ]]; then
            echo "::error::Release state changed while builds were running."
            exit 1
          fi

      - name: Assemble and Validate Release Assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          node scripts/check-release-assets.mjs assemble \
            --input "release-assets" \
            --output "release-upload" \
            --manifest "release-manifest.json" \
            --tag "${RELEASE_TAG}" \
            --version "${RELEASE_VERSION}"
          (
            cd release-upload
            sha256sum liberty-* > SHA256SUMS.txt
          )
          node scripts/check-release-assets.mjs verify-directory \
            --input "release-upload" \
            --manifest "release-manifest.json" \
            --allow-checksums

      - name: Generate Release Notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          node scripts/check-version-consistency.mjs \
            --tag "${RELEASE_TAG}" \
            --changelog-output release-changelog.md

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${TARGET_COMMIT}" \
            --jq ".body" > github-release-notes.md

          {
            printf '<!-- liberty-release-commit:%s -->\n\n' "${TARGET_COMMIT,,}"
            cat release-changelog.md
            printf "\n\n---\n\n"
            printf "## GitHub 自动生成记录\n\n"
            cat github-release-notes.md
          } > release-notes.md

      - name: Resolve Draft Release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RESUMABLE_DRAFT_ID: ${{ needs.prepare.outputs.resumable_draft_id }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          release_id="${RESUMABLE_DRAFT_ID}"
          if [[ -z "${release_id}" ]]; then
            node scripts/check-release-state.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --expected-commit "${TARGET_COMMIT}" \
              --require-absent-release

            gh release create "${RELEASE_TAG}" \
              --title "Liberty ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --verify-tag \
              --draft

            release_id="$({
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id"
            } | head -n 1)"
          fi

          if [[ -z "${release_id}" ]]; then
            echo "::error::Draft Release ${RELEASE_TAG} was not found."
            exit 1
          fi

          node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --require-draft-release-id "${release_id}"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Plan Draft Asset Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          mkdir draft-existing
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Unsafe Release asset name: ${asset_name}"
                exit 1
              fi
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "draft-existing/${asset_name}"
            done

          node scripts/check-release-assets.mjs plan-draft-upload \
            --local "release-upload" \
            --existing "draft-existing" \
            --manifest "release-manifest.json" \
            --output "draft-upload-list.txt"

      - name: Upload Missing Draft Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            gh release upload "${RELEASE_TAG}" "release-upload/${asset_name}"
          done < draft-upload-list.txt

      - name: Verify Uploaded Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          mkdir release-verify
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Unsafe Release asset name: ${asset_name}"
                exit 1
              fi
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "release-verify/${asset_name}"
            done
          node scripts/check-release-assets.mjs verify-directory \
            --input "release-verify" \
            --manifest "release-manifest.json" \
            --allow-checksums

      - name: Publish Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          node scripts/check-release-state.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${TARGET_COMMIT}" \
            --require-draft-release-id "${RELEASE_ID}"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null
