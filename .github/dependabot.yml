version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
  - package-ecosystem: pip
    directory: /python/funasr-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - asr-benchmark-required
    commit-message:
      prefix: deps-runtime
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps-ci
