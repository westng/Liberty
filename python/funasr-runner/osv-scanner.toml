# Temporary, vulnerability-specific exceptions for the local FunASR runtime.
# PyTorch 2.2.2 is the newest compatible release that still publishes a
# Python 3.10 macOS Intel wheel. Models are downloaded by the Rust runtime at
# fixed 40-character revisions with per-file SHA-256 validation, and FunASR is
# run with disable_update=True. Reassess all exceptions before their expiry.

[[IgnoredVulns]]
id = "PYSEC-2024-259"
ignoreUntil = 2026-11-30
reason = "Temporary PyTorch 2.2.2 compatibility exception; fixed-revision, SHA-256-verified local models reduce exposure."

