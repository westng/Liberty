[package]
name = "liberty"
version = "1.1.24"
description = "Liberty desktop client"
authors = ["west"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "liberty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
calamine = "0.36.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
docx-rs = "0.4.22"
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regress = "0.11.1"
ring = "0.17.14"
rust_xlsxwriter = "0.79"
rusqlite = { version = "0.31", features = ["backup", "bundled"] }
semver = "1.0"
sevenz-rust2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
tar = "0.4"
tauri = { version = "2.0.0", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
typify = "0.7.0"
xmltree = "0.11"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSImage",
  "NSImageView",
  "NSResponder",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
  "objc2-core-graphics",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
webview2-com = "0.38.2"
windows = "0.61.3"
windows-sys = { version = ">=0.60, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
