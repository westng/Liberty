[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "i686-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Tauri 2.11 pins urlpattern 0.3; this is an unmaintained-only advisory with no safe upstream upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "Tauri 2.11 pins urlpattern 0.3; this is an unmaintained-only advisory with no safe upstream upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "Tauri 2.11 pins urlpattern 0.3; this is an unmaintained-only advisory with no safe upstream upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "Tauri 2.11 pins urlpattern 0.3; this is an unmaintained-only advisory with no safe upstream upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "Tauri 2.11 pins urlpattern 0.3; this is an unmaintained-only advisory with no safe upstream upgrade" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
